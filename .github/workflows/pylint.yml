name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Atualizado para v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Opcional: acelera a instalação cacheando dependências
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pre-commit
        
    - name: Analysing the code
      run: |
        # Roda o pre-commit (certifique-se de ter o .pre-commit-config.yaml)
        pre-commit run --all-files
        
        # Roda o pylint procurando arquivos .py (usando xargs para maior segurança)
        git ls-files '*.py' | xargs --no-run-if-empty pylint
